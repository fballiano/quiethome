# Builds the APK on every push and pull request. A tag such as v0.2.0 also publishes a GitHub
# Release with quiethome.apk, signed with the release key from the repository secrets
# KEYSTORE_BASE64 (the keystore file, base64) and KEYSTORE_PASS, with a build provenance
# attestation: gh attestation verify quiethome.apk --repo fballiano/quiethome
#
# Actions are pinned to full commit SHAs; Dependabot keeps them current.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Each job asks for only what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Set the version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            # v1.2.3 gives version 1.2.3 and version code 10203.
            name=${GITHUB_REF_NAME#v}
            core=${name%%-*}
            major=$(echo "$core" | cut -d. -f1)
            minor=$(echo "$core" | cut -d. -f2)
            patch=$(echo "$core" | cut -d. -f3)
            echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$(( major * 10000 + ${minor:-0} * 100 + ${patch:-0} ))" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Use the release key
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "The KEYSTORE_BASE64 secret is missing." >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"

      - name: Build
        run: PLATFORM=android-36 BUILD_TOOLS=36.0.0 sh build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quiethome-${{ env.VERSION_NAME }}
          path: out/quiethome.apk

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release
      id-token: write       # sign the build provenance attestation
      attestations: write
    steps:
      - name: Set the version
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The notes are the section "## <version>" of CHANGELOG.md at the tag. Without it, nothing is released.
      - name: Read the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_REF_NAME" \
            | awk -v v="$VERSION_NAME" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION_NAME"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quiethome-${{ env.VERSION_NAME }}

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: quiethome.apk

      # gh uploads the APK to a draft and publishes it after, which immutable releases need.
      # GitHub adds its generated notes (the compare link) after notes.md.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" quiethome.apk --repo "$GITHUB_REPOSITORY" --verify-tag --title "QuietHome $VERSION_NAME" --notes-file notes.md --generate-notes
